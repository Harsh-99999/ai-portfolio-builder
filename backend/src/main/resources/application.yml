spring:
  application:
    name: portfolio-builder-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_builder}
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  github:
    token: ${GITHUB_TOKEN:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

